<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FAF5ED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>한미르호 비서실</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./images/jarvis.png" />
  <link rel="apple-touch-icon" href="./images/jarvis.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="top-header">
      <div class="brand-wrap">
        <div class="brand-icon">🚢</div>
        <div>
          <h1 class="brand-title">한미르호 비서실</h1>
          <div class="brand-sub"><span class="dot-online"></span> 창민님 전용 · 4인 비서팀</div>
        </div>
      </div>
      <div class="live-pill">
        <span class="dot-online pulse"></span>
        <span>실시간 연결</span>
      </div>
    </header>

    <!-- 상단 탭 메뉴 -->
    <nav class="tab-grid" aria-label="비서실 메뉴">
      <button class="tab-btn active" data-tab="map">🗺️ 오피스 맵</button>
      <button class="tab-btn" data-tab="meeting">💬 회의실</button>
      <button class="tab-btn" data-tab="tasks">📋 작업실</button>
      <button class="tab-btn" data-tab="status">📊 비서현황</button>
      <button class="tab-btn" data-tab="memos">📝 메모</button>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
      <!-- 1. 오피스 맵 -->
      <section id="tab-map" class="tab-panel active">
        <div class="hero-card">
          <div class="hero-badge">⚓ 한미르호 비서실 본부</div>
          <h2 class="hero-title">선장님, 비서 4명이 대기 중이에요</h2>
          <p class="hero-desc">방이나 비서를 눌러 보세요. 각자 맡은 업무를 보고 있어요.</p>
        </div>

        <div class="control-row">
          <div class="segmented">
            <button class="seg-btn" id="btn-style-basic">🗺️ 기본</button>
            <button class="seg-btn active" id="btn-style-clay">🧸 클레이</button>
          </div>
          <button class="toggle-pill active" id="btn-motion">✨ 움직임 ON</button>
        </div>

        <div class="chip-row">
          <span class="info-chip"><span class="dot-online"></span> 4개 방 가동</span>
          <span class="info-chip">👥 ON 4명</span>
          <span class="info-chip" id="last-updated-chip">🕒 방금 동기화</span>
        </div>

        <div class="office-stage clay motion-on" id="office-stage">
          <img src="./images/office-bg.png" alt="한미르호 비서실 오피스 맵" class="office-bg" />
          <div id="office-pins" class="office-pins"></div>
          <div class="room-tag room-conference">🏛️ 대회의실</div>
          <div class="room-tag room-lounge">☕ 라운지</div>
        </div>
      </section>

      <!-- 2. 회의실 -->
      <section id="tab-meeting" class="tab-panel">
        <div class="section-card">
          <div class="section-head">
            <h3>💬 비서실 회의실</h3>
            <span class="small-muted">@이름으로 지시하면 피클에 바로 전달할 수 있어요</span>
          </div>
          <div class="chat-list" id="chat-list"></div>
          <div class="mention-bar" id="mention-bar">
            <button class="mention-chip active" data-mention="@자비스">@자비스</button>
            <button class="mention-chip" data-mention="@마루">@마루</button>
            <button class="mention-chip" data-mention="@마린이">@마린이</button>
            <button class="mention-chip" data-mention="@부캉이">@부캉이</button>
          </div>
          <form class="chat-form" id="chat-form">
            <input type="text" id="chat-input" placeholder="예: @부캉이 명지 청약 새 공고 확인해줘" autocomplete="off" />
            <button type="submit" class="send-btn">전송</button>
          </form>
          <p class="helper-note">💡 전송하면 회의실에 기록되고, 클립보드에 자동 복사돼 피클 채팅에 바로 붙여넣을 수 있어요.</p>
        </div>
      </section>

      <!-- 3. 작업실 -->
      <section id="tab-tasks" class="tab-panel">
        <div class="section-card">
          <div class="section-head">
            <h3>📋 작업실</h3>
            <span class="small-muted" id="task-count-label">총 0건</span>
          </div>
          <div class="task-list" id="task-list"></div>
        </div>
      </section>

      <!-- 4. 비서현황 -->
      <section id="tab-status" class="tab-panel">
        <div class="agent-grid" id="agent-grid"></div>
      </section>

      <!-- 5. 메모 -->
      <section id="tab-memos" class="tab-panel">
        <div class="section-card">
          <div class="section-head">
            <h3>📝 선장님 메모장</h3>
            <span class="small-muted">기억해 둘 일 &amp; 마감 체크</span>
          </div>
          <form class="memo-form" id="memo-form">
            <input type="text" id="memo-input" placeholder="새 메모를 적어두세요..." autocomplete="off" />
            <button type="submit" class="send-btn">저장</button>
          </form>
          <div class="memo-list" id="memo-list"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 비서 상세 바텀시트 -->
  <div class="modal-backdrop" id="agent-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <img id="modal-avatar" src="" alt="" class="modal-avatar" />
        <div>
          <div class="modal-room" id="modal-room"></div>
          <h3 class="modal-name" id="modal-name"></h3>
          <div class="modal-role" id="modal-role"></div>
        </div>
        <button class="modal-close" id="modal-close" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-box">
          <div class="modal-label">현재 상태</div>
          <div class="modal-value" id="modal-task"></div>
        </div>
        <div class="modal-box">
          <div class="modal-label">담당 업무</div>
          <div class="modal-value" id="modal-desc"></div>
        </div>
      </div>
      <button class="modal-action-btn" id="modal-ask-btn">💬 이 비서에게 일 시키기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
